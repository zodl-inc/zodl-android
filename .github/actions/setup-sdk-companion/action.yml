name: 'Companion SDK Build (commit-pinned)'
description: >-
  If SDK_COMMIT_PIN is set in gradle.properties, checks out that exact commit of
  the SDK repository named by sdk-repo, installs its Rust/NDK toolchain, and points
  Gradle's composite build at it via ORG_GRADLE_PROJECT_SDK_INCLUDED_BUILD_PATH — so a
  co-developed app PR can build/lint/test against unreleased SDK changes without waiting on
  a Maven publish. Supported on main, maint/* branches, and branches targeting either.
  No-ops (does nothing) whenever the pin is blank, which is the default, normal case for
  every branch that isn't actively co-developing against an SDK PR.
outputs:
  active:
    description: "'true' if the companion SDK build was activated this run, else empty."
    value: ${{ steps.pin.outputs.commit != '' && 'true' || '' }}
inputs:
  sdk-repo:
    description: >-
      owner/name of the SDK repository to check SDK_COMMIT_PIN out of. Optional: callers
      pass the SDK_COMPANION_REPO repository variable, and when it is empty the SDK repo is
      derived from this repo's own name - the app's private twin builds against the SDK's
      private twin, the public app against the public SDK. The name is never hardcoded here,
      so nothing private-only reaches the public repo when this file is published.
    required: false
    default: ''
  sdk-token:
    description: >-
      Token with contents:read on the sdk-repo repository, needed only
      when SDK_COMMIT_PIN is set. GITHUB_TOKEN cannot read a different private repo, even
      within the same org.
    required: false
    default: ''
  cargo-app-id:
    description: GitHub App ID for private slipstream-internal git dependency (companion SDK Rust build)
    required: false
    default: ''
  cargo-app-private-key:
    description: GitHub App private key for private slipstream-internal git dependency (companion SDK Rust build)
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Read SDK_COMMIT_PIN and enforce the branch gate
      id: pin
      shell: bash
      env:
        SDK_REPO: ${{ inputs.sdk-repo }}
        SDK_TOKEN: ${{ inputs.sdk-token }}
      run: |
        PIN="$(grep -m1 '^SDK_COMMIT_PIN=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
        [ -z "${PIN}" ] || [[ "${PIN}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::SDK_COMMIT_PIN must be a full 40-char commit sha'; exit 1; }
        # Fail loudly here rather than letting the checkout step below fail on an empty token, and
        # never silently widen to a broader repo-scoped secret if SDK_COMPANION_TOKEN isn't set --
        # that would grant this job whatever else that broader secret can reach, not just
        # contents:read on the one companion repo it actually needs.
        if [ -n "${PIN}" ] && [ -z "${SDK_TOKEN}" ]; then
          echo "::error::SDK_COMMIT_PIN is set to '${PIN}' but no sdk-token input was provided. Configure the SDK_COMPANION_TOKEN secret (contents:read on the companion SDK repository) rather than substituting a broader-scoped secret." >&2
          exit 1
        fi
        TARGET="${{ github.event.pull_request.base.ref || github.base_ref || github.ref_name }}"
        if [ -n "${PIN}" ] && [ "${TARGET}" != "main" ] && [[ "${TARGET}" != maint/* ]]; then
          echo "::error::SDK_COMMIT_PIN is set to '${PIN}' but this workflow's target branch is '${TARGET}'. SDK_COMMIT_PIN is only supported on main, maint/* branches, and branches targeting them — clear it before merging into release/review branches, which must always build against a real published SDK version." >&2
          exit 1
        fi
        if [ -z "${SDK_REPO}" ]; then
          # Twin convention: <owner>/zodl-android[-private] builds against
          # <owner>/zodl-android-wallet-sdk[-private].
          SUFFIX=""
          case "${GITHUB_REPOSITORY}" in *-private) SUFFIX="-private" ;; esac
          SDK_REPO="${GITHUB_REPOSITORY_OWNER}/zodl-android-wallet-sdk${SUFFIX}"
        fi
        echo "commit=${PIN}" >> "$GITHUB_OUTPUT"
        echo "repo=${SDK_REPO}" >> "$GITHUB_OUTPUT"
    - name: Free runner disk space for the companion SDK build
      if: steps.pin.outputs.commit != ''
      shell: bash
      run: |
        # Compiling the companion SDK's Rust plus the app exhausts the ~14GB free on a
        # standard ubuntu-latest runner (ENOSPC in cargoBuild*/mergeJniLibFolders). Drop
        # preinstalled toolchains nothing in this build uses; the Android SDK stays.
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup \
          /usr/local/share/powershell /usr/share/swift /usr/local/lib/node_modules \
          /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
        sudo docker image prune --all --force > /dev/null 2>&1 || true
        df -h /
    - name: Checkout companion SDK commit
      if: steps.pin.outputs.commit != ''
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: ${{ steps.pin.outputs.repo }}
        # When the SDK repo is private, GITHUB_TOKEN cannot read it (a different private repo),
        # so a token with contents:read on it must be supplied by
        # the caller via sdk-token.
        token: ${{ inputs.sdk-token }}
        ref: ${{ steps.pin.outputs.commit }}
        path: .sdk-companion
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Android NDK for the companion SDK build
      if: steps.pin.outputs.commit != ''
      shell: bash
      run: |
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=${ANDROID_ROOT}/sdk
        SDKMANAGER=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager
        echo "y" | "${SDKMANAGER}" "ndk;27.0.12077973"
    - name: Set up Rust toolchain for the companion SDK build
      if: steps.pin.outputs.commit != ''
      shell: bash
      working-directory: .sdk-companion
      run: |
        # rust-toolchain.toml in the SDK checkout is the single source of truth for the
        # channel and target list — read it rather than hardcoding a version here, so this
        # step never silently drifts from what the SDK itself actually builds with.
        CHANNEL="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        rustup toolchain install "${CHANNEL}"
        rustup default "${CHANNEL}"
        rustup target add --toolchain "${CHANNEL}" x86_64-linux-android
    - name: Limit the companion SDK build to x86_64
      if: steps.pin.outputs.commit != ''
      shell: bash
      run: |
        # rust-android-gradle reads rust.targets from the SDK build's own root
        # local.properties and uses it in place of backend-lib's four-ABI list. CI only
        # needs x86_64 (the emulator jobs run x86_64 images); building all four ABIs cold
        # overran both runner disk and job timeouts. APKs from a pinned CI run therefore
        # carry only x86_64 native code -- fine, since the branch gate above keeps
        # SDK_COMMIT_PIN off release branches.
        echo "rust.targets=x86_64" >> .sdk-companion/local.properties
    - name: Authorize cargo against the private slipstream repositories (companion SDK)
      if: steps.pin.outputs.commit != '' && inputs.cargo-app-id != '' && inputs.cargo-app-private-key != ''
      id: slipstream-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ inputs.cargo-app-id }}
        private-key: ${{ inputs.cargo-app-private-key }}
        owner: zodl-inc
        repositories: slipstream,slipstream-internal,ohttp
    - name: Point cargo git fetches at the App token (companion SDK)
      if: steps.pin.outputs.commit != '' && steps.slipstream-token.outputs.token != ''
      shell: bash
      env:
        SLIPSTREAM_TOKEN: ${{ steps.slipstream-token.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${SLIPSTREAM_TOKEN}@github.com/zodl-inc/".insteadOf "https://github.com/zodl-inc/"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
    - name: Free the runner tool cache before companion SDK Rust build
      if: steps.pin.outputs.commit != ''
      shell: bash
      run: |
        # The toolchains the earlier "Free runner disk space" step already removed are not
        # removed again here; this drops the rest of the runner tool cache to leave room for
        # Rust cross-compilation. The NDK (27.0.12077973) lives in the Android SDK, not in it.
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
        echo "Disk space after cleanup:"
        df -h /
    - name: Rust cache for the companion SDK build
      if: steps.pin.outputs.commit != ''
      uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      with:
        # Cache for the companion SDK's backend-lib workspace (checked out to .sdk-companion/).
        # Auto-detects Cargo.lock and includes vendored dependencies in cache key.
        workspaces: .sdk-companion/backend-lib
        cache-targets: "true"
        cache-all-crates: "true"
        # Shared key with SDK repo's own Rust cache for potential cross-workflow warmup.
        # The commit pin ensures cache invalidation when SDK_COMMIT_PIN changes.
        shared-key: "android-rust-${{ steps.pin.outputs.commit }}"
        save-if: "true"
    - name: Export SDK composite build override
      if: steps.pin.outputs.commit != ''
      shell: bash
      env:
        SDK_REPO: ${{ steps.pin.outputs.repo }}
      run: |
        echo "ORG_GRADLE_PROJECT_SDK_INCLUDED_BUILD_PATH=${{ github.workspace }}/.sdk-companion" >> "$GITHUB_ENV"
        # The SDK's build-conventions module locks its own (build-tooling-only, not
        # shipped-library) dependency graph via Gradle's dependencyLocking. Consumed as a
        # composite build, that graph resolves inside this app's unified build session
        # instead of standalone, which can shift a version just enough to violate the
        # lock even though nothing about the actual voting/migration library code changed.
        # ZCASH_IS_DEPENDENCY_LOCKING_ENABLED is build-conventions/build.gradle.kts's own,
        # purpose-built escape hatch for exactly this (deliberately read only from a
        # system property/CLI arg/env var, never from gradle.properties, so an included
        # build's own gradle.properties can't silently flip it) — safe to disable here
        # since this env var reaches only the companion build's tooling classpath
        # resolution, not the app's own dependency locking (if any).
        echo "ORG_GRADLE_PROJECT_ZCASH_IS_DEPENDENCY_LOCKING_ENABLED=false" >> "$GITHUB_ENV"
        echo "::notice::Building against ${SDK_REPO}@${{ steps.pin.outputs.commit }} (SDK_COMMIT_PIN), not the published Maven artifact."
    - name: Cap memory and parallelism for the companion SDK build
      if: steps.pin.outputs.commit != ''
      shell: bash
      run: |
        # The app's Gradle daemon (-Xmx4g), its Kotlin daemon and the companion SDK's
        # parallel rustc jobs share a 16 GB standard runner. Jobs on pinned builds hung for
        # 10-25 min and then died with "The runner has received a shutdown signal" (exit 143),
        # the pattern of a runner out of memory. GRADLE_USER_HOME properties take precedence
        # over the project's gradle.properties, so this caps the pinned CI builds only.
        mkdir -p "${HOME}/.gradle"
        {
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          echo "org.gradle.workers.max=2"
          echo "kotlin.daemon.jvmargs=-Xmx2g"
        } >> "${HOME}/.gradle/gradle.properties"
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
        # Extra swap on the scratch disk, so a peak slows the build down instead of
        # freezing the runner agent.
        sudo fallocate -l 8G /mnt/companion.swap && sudo chmod 600 /mnt/companion.swap \
          && sudo mkswap /mnt/companion.swap > /dev/null && sudo swapon /mnt/companion.swap || true
        free -m
