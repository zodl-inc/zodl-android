# TEMPORARY (2026-10-27): copies two secrets that only exist on GitHub into
# AWS Secrets Manager, so github-config can manage them. Never merge; the
# branch, the PR and the IAM role are deleted right after the run.
name: tmp recover secrets to SM

on:
  pull_request:
    paths:
      - .github/workflows/tmp-recover-secrets.yml

permissions:
  contents: read

jobs:
  copy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: firebase-distribution
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Write secrets to Secrets Manager
        env:
          KEYSTORE: ${{ secrets.FIREBASE_DEBUG_KEYSTORE_BASE64 }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_WALLET_TEAM }}
          ROLE_ARN: arn:aws:iam::907793002116:role/tmp-zodl-android-secret-recover
          AWS_REGION: us-east-1
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
            --role-session-name recover-secrets --web-identity-token "$token" \
            --query Credentials --output json)
          export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds")
          export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds")
          export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds")
          put() {
            if [ -z "$2" ]; then echo "$1: empty on GitHub, skipped"; return; fi
            printf '%s' "$2" > /tmp/value
            aws secretsmanager put-secret-value --secret-id "$1" \
              --secret-string file:///tmp/value --query VersionId --output text > /dev/null
            rm -f /tmp/value
            echo "$1: written (${#2} bytes)"
          }
          put /github/zodl-android/env/firebase-distribution/FIREBASE_DEBUG_KEYSTORE_BASE64 "$KEYSTORE"
          put /github/zodl-android/SLACK_WEBHOOK_URL_WALLET_TEAM "$WEBHOOK"
