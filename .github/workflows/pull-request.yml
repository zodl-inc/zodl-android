# Expected secrets
# FIREBASE_TEST_LAB_SERVICE_ACCOUNT - Email address of Firebase Test Lab service account
# FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER - Workload identity provider to generate temporary service account key
# FIREBASE_DEBUG_JSON_BASE64 - Optional JSON to enable Firebase (e.g. Crashlytics) for debug builds
# FIREBASE_RELEASE_JSON_BASE64 - Optional JSON to enable Firebase (e.g. Crashlytics) for release builds

# Expected variables
# FIREBASE_TEST_LAB_PROJECT - Firebase Test Lab project name

name: Pull Request

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The OHTTP endpoint configuration the companion SDK's native library is compiled with
# (zodl-ohttp-client reads it at build time; unset = OHTTP off in that build). Repository secrets, so
# the log masks them; no step prints them. Only builds with SDK_COMMIT_PIN compile the SDK, so a
# release (published SDK) never reads them.
env:
  ZODL_OHTTP_GATEWAY_HOST_MAINNET: ${{ secrets.ZODL_OHTTP_GATEWAY_HOST_MAINNET }}
  ZODL_OHTTP_GATEWAY_HOST_TESTNET: ${{ secrets.ZODL_OHTTP_GATEWAY_HOST_TESTNET }}
  ZODL_OHTTP_RELAY_URL_MAINNET: ${{ secrets.ZODL_OHTTP_RELAY_URL_MAINNET }}
  ZODL_OHTTP_RELAY_URL_TESTNET: ${{ secrets.ZODL_OHTTP_RELAY_URL_TESTNET }}
  ZODL_OHTTP_KEYS_DNS_NAME_MAINNET: ${{ secrets.ZODL_OHTTP_KEYS_DNS_NAME_MAINNET }}
  ZODL_OHTTP_KEYS_DNS_NAME_TESTNET: ${{ secrets.ZODL_OHTTP_KEYS_DNS_NAME_TESTNET }}
  ZODL_OHTTP_SIGNING_PUBKEY_MAINNET: ${{ secrets.ZODL_OHTTP_SIGNING_PUBKEY_MAINNET }}
  ZODL_OHTTP_SIGNING_PUBKEY_TESTNET: ${{ secrets.ZODL_OHTTP_SIGNING_PUBKEY_TESTNET }}

jobs:
  validate_gradle_wrapper:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Gradle Wrapper Validation
        timeout-minutes: 1
        uses: gradle/actions/wrapper-validation@v6

  check_firebase_secrets:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      has-secrets: ${{ steps.check_firebase_secrets.outputs.defined }}
    steps:
      - id: check_firebase_secrets
        env:
          FIREBASE_TEST_LAB_PROJECT: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          FIREBASE_TEST_LAB_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT }}
          FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER }}
        if: "${{ env.FIREBASE_TEST_LAB_PROJECT != '' && env.FIREBASE_TEST_LAB_SERVICE_ACCOUNT != '' && env.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT

  check_properties:
    needs: validate_gradle_wrapper
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Check properties
        timeout-minutes: 4
        run: |
          ./gradlew checkProperties

  static_analysis_detekt:
    needs: validate_gradle_wrapper
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Detekt
        timeout-minutes: 10
        run: |
          ./gradlew detektAll
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        run: |
          export ARTIFACTS_DIR_PATH=~/artifacts
          export REPORTS_ZIP_PATH=${ARTIFACTS_DIR_PATH}/static_analysis_detekt.zip

          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${REPORTS_ZIP_PATH} . -i build/reports/detekt/*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Detekt static analysis results
          path: ~/artifacts

  static_analysis_ktlint:
    needs: validate_gradle_wrapper
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Ktlint
        timeout-minutes: 4
        run: |
          ./gradlew ktlint
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        run: |
          export ARTIFACTS_DIR_PATH=~/artifacts
          export REPORTS_ZIP_PATH=${ARTIFACTS_DIR_PATH}/static_analysis_ktlint.zip

          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${REPORTS_ZIP_PATH} . -i build/reports/ktlint/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Ktlint static analysis results
          path: ~/artifacts

  static_analysis_android_lint:
    needs: validate_gradle_wrapper
    runs-on: ${{ vars.LINUX_RUNNER_LONG || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      # PR builds only need x86_64 for smoke testing, saving ~4x disk and build time.
      RUST_ANDROID_ABIS: x86_64
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up companion SDK build (if SDK_COMMIT_PIN is set)
        timeout-minutes: 30
        uses: ./.github/actions/setup-sdk-companion
        with:
          sdk-repo: ${{ vars.SDK_COMPANION_REPO }}
          sdk-token: ${{ secrets.SDK_COMPANION_TOKEN }}
          cargo-app-id: ${{ secrets.CARGO_PRIVATE_APP_ID }}
          cargo-app-private-key: ${{ secrets.CARGO_PRIVATE_APP_KEY }}
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Android Lint
        # 120 minutes for cold-cache first run: when SDK_COMMIT_PIN is set (see
        # setup-sdk-companion), this compiles the full companion SDK's Rust dependency
        # graph (vendored zodl-slipstream + arti/hpke, orchard, etc.) for x86_64 — observed
        # at ~45+ min alone before lint analysis. Warm-cache runs (after Swatinem/rust-cache
        # in setup-sdk-companion seeds artifacts) complete in <30 min.
        timeout-minutes: 120
        env:
          # Disable minify, since it makes lint run faster
          ORG_GRADLE_PROJECT_IS_MINIFY_ENABLED: false
        run: |
          ./gradlew :app:lintZcashmainnetStoreRelease
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          export ARTIFACTS_DIR_PATH=~/artifacts
          export LINT_ZIP_PATH=${ARTIFACTS_DIR_PATH}/android_lint.zip

          mkdir ${ARTIFACTS_DIR_PATH}
          
          zip -r ${LINT_ZIP_PATH} . -i \*build/reports/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Android Lint static analysis results
          path: ~/artifacts

  # Translation checks run apart from the Kotlin unit tests on purpose:
  # translation drift on the merge base must not stop the unit tests from
  # running and reporting their own signal.
  check_translations:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        # check_translations.py needs Python 3.9+ (str.removesuffix).
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check translations and checker fixtures
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_translations.py
      - name: Baseline must not grow in a pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          python3 - <<'EOF'
          import json
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          from check_translations import Issue, baseline_additions

          show = subprocess.run(
              ["git", "show", "FETCH_HEAD:scripts/translation-baseline.json"],
              capture_output=True, text=True,
          )
          if show.returncode:
              print("No baseline on the base branch; initial adoption is allowed.")
              sys.exit(0)

          def debts(data):
              return {Issue(**entry) for entry in data["issues"]}

          base = debts(json.loads(show.stdout))
          head = debts(json.load(open("scripts/translation-baseline.json")))
          added = sorted(baseline_additions(head, base))
          for entry in added:
              print("ADDED:", entry)
          if added:
              print("::error::translation-baseline.json gained entries; the baseline only shrinks. Fix the resource instead of deferring it.")
          sys.exit(1 if added else 0)
          EOF

  test_kotlin_modules:
    needs: validate_gradle_wrapper
    runs-on: ${{ vars.LINUX_RUNNER_LONG || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      # PR builds only need x86_64 for smoke testing, saving ~4x disk and build time.
      RUST_ANDROID_ABIS: x86_64
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up companion SDK build (if SDK_COMMIT_PIN is set)
        timeout-minutes: 30
        uses: ./.github/actions/setup-sdk-companion
        with:
          sdk-repo: ${{ vars.SDK_COMPANION_REPO }}
          sdk-token: ${{ secrets.SDK_COMPANION_TOKEN }}
          cargo-app-id: ${{ secrets.CARGO_PRIVATE_APP_ID }}
          cargo-app-private-key: ${{ secrets.CARGO_PRIVATE_APP_KEY }}
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Test
        # 120 minutes for cold-cache first run: when SDK_COMMIT_PIN is set (see
        # setup-sdk-companion), compiling :ui-lib pulls in the full companion SDK's Rust
        # dependency graph (vendored zodl-slipstream + arti/hpke, etc.) for x86_64 — takes
        # ~45+ min on cold cargo/target cache. Warm-cache runs complete in <30 min.
        timeout-minutes: 120
        run: |
          ./gradlew :configuration-api-lib:check :crash-lib:check :preference-api-lib:check :spackle-lib:check :ui-design-lib:check :preference-impl-android-lib:testDebugUnitTest
          ./gradlew :ui-lib:testZcashmainnetStoreDebugUnitTest :feature-ledger:testZcashmainnetStoreDebugUnitTest :feature-migration:testZcashmainnetStoreDebugUnitTest :feature-voting:testZcashmainnetStoreDebugUnitTest :feature-viewing-key:testZcashmainnetStoreDebugUnitTest
          python3 scripts/verify-unit-test-results.py
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          export ARTIFACTS_DIR_PATH=~/artifacts
          export RESULTS_ZIP_PATH=${ARTIFACTS_DIR_PATH}/test_kotlin.zip

          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${RESULTS_ZIP_PATH} . -i \*build/reports/\* \*/build/kover/html/\* \*/build/kover/xml/report.xml \*/build/test-results/\*.xml
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Test Kotlin modules results
          path: ~/artifacts

  # Runs Android instrumentation tests on a local KVM-accelerated
  # emulator via reactivecircus/android-emulator-runner. Mirrors the proven
  # pattern from e2e-smoke.yml. The matrix splits the workload into two shards
  # so they run in parallel: `libs` covers everything except the app + screenshot
  # tests (with Jacoco coverage on), and `app` covers `:app` and `:ui-screenshot-test`
  # (coverage off, because Jacoco bytecode rewrite breaks screenshot tests).
  test_android_modules_emulator:
    name: test_android_modules_emulator (${{ matrix.shard }})
    needs: [validate_gradle_wrapper]
    runs-on: ubuntu-24.04
    # 120 minutes for cold-cache first run: the `app` shard needs the SDK compiled, and when
    # SDK_COMMIT_PIN is set (see setup-sdk-companion) a cold cargo/target cache (vendored
    # zodl-slipstream + arti/hpke, x86_64 only) takes ~45+ min before emulator/test steps start.
    # Warm-cache runs complete in <60 min. Previous 90 min caused emulator death mid-run.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # PR builds only need x86_64 for the emulator, saving ~4x disk and build time.
      RUST_ANDROID_ABIS: x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: libs
            coverage: true
            assemble-tasks: >-
              assembleDebugAndroidTest
              -x :app:assembleZcashmainnetStoreDebugAndroidTest
              :app:assembleZcashmainnetStoreDebug
              :ui-integration-test:assembleZcashmainnetStoreDebug
            gradle-tasks: >-
              connectedDebugAndroidTest
              -x :app:connectedZcashmainnetStoreDebugAndroidTest
              -x :ui-screenshot-test:connectedZcashmainnetStoreDebugAndroidTest
              -x :ui-integration-test:connectedZcashmainnetStoreDebugAndroidTest
              -x :ui-benchmark-test:connectedDebugAndroidTest
              :ui-integration-test:connectedZcashmainnetStoreDebugAndroidTest
          - shard: app
            coverage: false
            assemble-tasks: >-
              :app:assembleZcashmainnetStoreDebug
              :app:assembleZcashmainnetStoreDebugAndroidTest
              :ui-screenshot-test:assembleZcashmainnetStoreDebug
            gradle-tasks: >-
              :app:connectedZcashmainnetStoreDebugAndroidTest
              :ui-screenshot-test:connectedZcashmainnetStoreDebugAndroidTest
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up companion SDK build (if SDK_COMMIT_PIN is set)
        timeout-minutes: 30
        uses: ./.github/actions/setup-sdk-companion
        with:
          sdk-repo: ${{ vars.SDK_COMPANION_REPO }}
          sdk-token: ${{ secrets.SDK_COMPANION_TOKEN }}
          cargo-app-id: ${{ secrets.CARGO_PRIVATE_APP_ID }}
          cargo-app-private-key: ${{ secrets.CARGO_PRIVATE_APP_KEY }}
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Pre-build instrumentation APKs
        # Both shards compile before emulator boot. The libs runner has repeatedly
        # shut down while compiling APKs alongside an already-running emulator.
        # Keep the same resource and coverage settings as the test invocation so
        # it can reuse these APKs instead of compiling them again after boot.
        # Keep Kotlin in the bounded Gradle heap, then release that heap before
        # emulator startup on the standard hosted runner.
        timeout-minutes: 120
        env:
          ORG_GRADLE_PROJECT_ZCASH_DEBUG_APP_NAME_SUFFIX: ""
          ORG_GRADLE_PROJECT_IS_ANDROID_INSTRUMENTATION_TEST_COVERAGE_ENABLED: ${{ matrix.coverage }}
        run: |
          ./gradlew ${{ matrix.assemble-tasks }} --max-workers=2 --no-parallel --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process
          python3 - <<'PY'
          import json
          from pathlib import Path

          variant = "zcashmainnetStoreDebug"
          modules = ["app", "ui-screenshot-test" if "${{ matrix.shard }}" == "app" else "ui-integration-test"]
          for module in modules:
              metadata = []
              for path in (Path(module) / "build/outputs/apk").rglob("output-metadata.json"):
                  data = json.loads(path.read_text())
                  if data.get("variantName") == variant:
                      metadata.append((path, data))
              if len(metadata) != 1:
                  raise SystemExit(f"Expected one prepared {variant} APK metadata file for {module}")
              path, data = metadata[0]
              apks = [path.parent / entry["outputFile"] for entry in data.get("elements", [])]
              if not apks or not all(apk.is_file() and apk.stat().st_size for apk in apks):
                  raise SystemExit(f"Prepared {variant} APK is missing for {module}")
              print(f"Verified {module}: {len(apks)} prepared {variant} APK(s)")
          PY
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Boot once from a fresh AVD. The separate cache-warming boot timed out
      # before the library tests started; tests do not need a saved snapshot.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Force blank suffix for screenshot tests
          ORG_GRADLE_PROJECT_ZCASH_DEBUG_APP_NAME_SUFFIX: ""
          ORG_GRADLE_PROJECT_IS_ANDROID_INSTRUMENTATION_TEST_COVERAGE_ENABLED: ${{ matrix.coverage }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew ${{ matrix.gradle-tasks }} --max-workers=2 --no-parallel --stacktrace
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process
      - name: Emulator host diagnostics
        if: failure()
        run: |
          free -m
          df -h /
          # Process names and memory only: never print command arguments.
          ps -eo pid,comm,rss --sort=-rss | sed -n '1,16p'
          sudo dmesg | grep -Ei 'out of memory|oom-kill|killed process|segfault' || true
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          export ARTIFACTS_DIR_PATH=~/artifacts
          export TEST_RESULTS_ZIP_PATH=${ARTIFACTS_DIR_PATH}/test_results.zip

          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${TEST_RESULTS_ZIP_PATH} . -i \*/build/outputs/androidTest-results/\* \*/build/reports/androidTests/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Test Android modules emulator results (${{ matrix.shard }})
          path: ~/artifacts

  # Performs a button mash test on the debug build of the app with strict mode enabled.
  # Temporarily disabled — app crashes during Robo crawl (needs Firebase console to diagnose).
  test_robo_debug:
    if: false && needs.check_firebase_secrets.outputs.has-secrets == 'true'
    needs: [check_firebase_secrets]
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Export Google Services JSON
        env:
          FIREBASE_DEBUG_JSON_BASE64: ${{ secrets.FIREBASE_DEBUG_JSON_BASE64 }}
          FIREBASE_RELEASE_JSON_BASE64: ${{ secrets.FIREBASE_RELEASE_JSON_BASE64 }}
        if: "${{ env.FIREBASE_DEBUG_JSON_BASE64 != '' && env.FIREBASE_RELEASE_JSON_BASE64 != '' }}"
        shell: bash
        run: |
          mkdir -p app/src/debug/
          mkdir -p app/src/release/
          echo ${FIREBASE_DEBUG_JSON_BASE64} | base64 --decode > app/src/debug/google-services.json
          echo ${FIREBASE_RELEASE_JSON_BASE64} | base64 --decode > app/src/release/google-services.json
      - name: Build
        timeout-minutes: 20
        env:
          ORG_GRADLE_PROJECT_IS_CRASH_ON_STRICT_MODE_VIOLATION: true
        run: |
          ./gradlew :app:assembleZcashmainnetStoreDebug :app:assembleZcashtestnetStoreDebug
      - name: Authenticate to Google Cloud for Firebase Test Lab
        id: auth_test_lab
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          create_credentials_file: true
          project_id: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          service_account: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER }}
          access_token_lifetime: '900s'
      - name: Robo test
        timeout-minutes: 20
        env:
          # This first environment variable is used by Flank, since the temporary token is missing the project name
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          ORG_GRADLE_PROJECT_ZCASH_FIREBASE_TEST_LAB_API_KEY_PATH: ${{ steps.auth_test_lab.outputs.credentials_file_path }}
        run: |
          ./gradlew :app:runFlankSanityConfigDebug

  build:
    needs: [validate_gradle_wrapper]
    runs-on: ${{ vars.LINUX_RUNNER_LONG || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      # PR builds only need x86_64 for smoke testing; deploy workflow refuses live SDK_COMMIT_PIN anyway.
      RUST_ANDROID_ABIS: x86_64
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up companion SDK build (if SDK_COMMIT_PIN is set)
        timeout-minutes: 30
        uses: ./.github/actions/setup-sdk-companion
        with:
          sdk-repo: ${{ vars.SDK_COMPANION_REPO }}
          sdk-token: ${{ secrets.SDK_COMPANION_TOKEN }}
          cargo-app-id: ${{ secrets.CARGO_PRIVATE_APP_ID }}
          cargo-app-private-key: ${{ secrets.CARGO_PRIVATE_APP_KEY }}
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Export Google Services JSON
        env:
          FIREBASE_DEBUG_JSON_BASE64: ${{ secrets.FIREBASE_DEBUG_JSON_BASE64 }}
          FIREBASE_RELEASE_JSON_BASE64: ${{ secrets.FIREBASE_RELEASE_JSON_BASE64 }}
        if: "${{ env.FIREBASE_DEBUG_JSON_BASE64 != '' && env.FIREBASE_RELEASE_JSON_BASE64 != '' }}"
        shell: bash
        run: |
          mkdir -p app/src/debug/
          mkdir -p app/src/release/
          echo ${FIREBASE_DEBUG_JSON_BASE64} | base64 --decode > app/src/debug/google-services.json
          echo ${FIREBASE_RELEASE_JSON_BASE64} | base64 --decode > app/src/release/google-services.json
      - name: Set Env
        shell: bash
        run: |
          echo "home=${HOME}" >> "$GITHUB_ENV"
      # A fake signing key to satisfy creating a "release" build
      - name: Export Signing Key
        env:
          SIGNING_KEY_PATH: ${{ format('{0}/release.jks', env.home) }}
        shell: bash
        run: |
          keytool -genkey -v -keystore $SIGNING_KEY_PATH -keypass android -storepass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 100000 -dname "CN=, OU=, O=Test, L=, S=, C=" -noprompt
      - name: Build Store APK
        # 120 minutes for cold-cache first run: when SDK_COMMIT_PIN is set (see
        # setup-sdk-companion), this compiles the full companion SDK's Rust dependency
        # graph (vendored zodl-slipstream + arti/hpke, etc.) for release profile, x86_64 only,
        # across both mainnet/testnet variants. Warm-cache runs complete in <45 min.
        timeout-minutes: 120
        env:
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PATH: ${{ format('{0}/release.jks', env.home) }}
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PASSWORD: android
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS_PASSWORD: android
        shell: bash
        run: |
          # Match the bounded concurrency used by the E2E APK build. This job
          # packages several variants, so avoid overlapping their packaging workers
          # and include the underlying exception if APK packaging fails.
          # This step's worker processes (bundletool's standalone-APK packaging,
          # in particular) can OOM on the standard runner's RAM when SDK_COMMIT_PIN
          # is set and the companion SDK's Rust compilation is sharing the box with
          # this already-heavy multi-variant release build. A fresh Gradle daemon
          # (and freshly-spawned workers) reliably clears it -- retry once, matching
          # zodl-helpers/scripts/deploy.sh's established OOM-retry-once handling for
          # this same build.
          TASKS=":app:assembleZcashmainnetStoreDebug :app:assembleZcashtestnetStoreDebug :app:bundleZcashmainnetStoreRelease :app:bundleZcashtestnetStoreRelease :app:packageZcashmainnetStoreReleaseUniversalApk"
          if ! ./gradlew ${TASKS} --max-workers=2 --no-parallel --stacktrace 2>&1 | tee build-store-apk.log; then
            if grep -qi "OutOfMemoryError\|Java heap space" build-store-apk.log; then
              echo "::warning::Build Store APK failed with OOM -- stopping the daemon and retrying once with a fresh heap."
              ./gradlew --stop
              ./gradlew ${TASKS} --max-workers=2 --no-parallel --stacktrace
            else
              exit 1
            fi
          fi

      - name: Collect Artifacts
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          BINARIES_ZIP_PATH: ${{ format('{0}/artifacts/binaries.zip', env.home) }}
          MAPPINGS_ZIP_PATH: ${{ format('{0}/artifacts/mappings.zip', env.home) }}
          COMPOSE_METRICS_ZIP_PATH: ${{ format('{0}/artifacts/compose_metrics.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}
          zip -r ${BINARIES_ZIP_PATH} . -i app/build/outputs/apk/\*/\*/\*.apk app/build/outputs/apk_from_bundle/\*/\*.apk app/build/outputs/bundle/\*/\*.aab
          zip -r ${MAPPINGS_ZIP_PATH} . -i *app/build/outputs/mapping/\*/\*/mapping.txt
          zip -r ${COMPOSE_METRICS_ZIP_PATH} . -i \*/build/compose-metrics/\* \*/build/compose-reports/\*

      - name: Strip non-FOSS libraries
        timeout-minutes: 10
        uses: ./.github/actions/foss/strip

      - name: Build FOSS APK
        timeout-minutes: 35
        env:
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PATH: ${{ format('{0}/release.jks', env.home) }}
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PASSWORD: android
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS_PASSWORD: android
          # No Flexa key: every build carries only the gateway's placeholder key (the OHTTP gateway injects
          # the real one), and Flexa is offered on FOSS too.
        run: |
          ./gradlew clean :app:assembleZcashmainnetFossRelease

      # The FOSS runtime classpath must resolve nothing F-Droid's inclusion policy forbids (the vendored
      # Flexa SDK is offered on every distribution since the perf/status round of 2026-10-22, so the
      # check runs here, on the branch the F-Droid build is made from, not only on feature/fdroid-parity).
      - name: Check FOSS dependencies
        timeout-minutes: 10
        run: |
          ./scripts/check-foss-dependencies.sh --self-test
          ./scripts/check-foss-dependencies.sh zcashmainnetFossReleaseRuntimeClasspath

      - name: F-Droid scanner
        timeout-minutes: 10
        run: |
          pipx run --spec fdroidserver fdroid scanner --exit-code --verbose \
            app/build/outputs/apk/zcashmainnetFoss/release/app-zcashmainnet-foss-release.apk

      - name: Check APK size
        timeout-minutes: 1
        run: |
          echo "## APK Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Size (MB) | Path |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|------|" >> $GITHUB_STEP_SUMMARY

          for apk in app/build/outputs/apk_from_bundle/*/*/*.apk app/build/outputs/apk/*/*/*.apk; do
            if [ -f "$apk" ]; then
              SIZE_BYTES=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk")
              SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
              BASENAME=$(basename "$apk")
              echo "| $BASENAME | $SIZE_MB | \`$apk\` |" >> $GITHUB_STEP_SUMMARY

              # Warn if APK exceeds 100MB
              if [ $(echo "$SIZE_MB > 100" | bc) -eq 1 ]; then
                echo "::warning::APK $BASENAME is larger than 100MB ($SIZE_MB MB)"
              fi
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 2
        with:
          name: Binaries
          path: ~/artifacts

  # Performs a button mash test on the release build of the app
  test_robo_release:
    if: needs.check_firebase_secrets.outputs.has-secrets == 'true'
    needs: [build, check_firebase_secrets]
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # to fetch all commits
      - name: Set up Java
        uses: ./.github/actions/setup-java
        timeout-minutes: 1
      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle
        timeout-minutes: 5
      - name: Authenticate to Google Cloud for Firebase Test Lab
        id: auth_test_lab
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          create_credentials_file: true
          project_id: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          service_account: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER }}
          access_token_lifetime: '900s'
      - name: Download a single artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Binaries
      - name: Robo test
        timeout-minutes: 25
        env:
          # Path depends on `release_build` job, plus path of `Download a single artifact` step
          BINARIES_ZIP_PATH: binaries.zip
          # This first environment variable is used by Flank, since the temporary token is missing the project name
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          ORG_GRADLE_PROJECT_ZCASH_FIREBASE_TEST_LAB_API_KEY_PATH: ${{ steps.auth_test_lab.outputs.credentials_file_path }}
        run: |
          unzip ${BINARIES_ZIP_PATH}
          ./gradlew :app:runFlankSanityConfigRelease
